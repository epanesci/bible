  {

    law: { ref: "Deuteronomio 6:5", text: "Amarás a Jehová tu Dios de todo tu corazón, y de toda tu alma, y con todas tus fuerzas." },
    verses: [
      { ref: "Génesis 1:1", text: "En el principio crió Dios los cielos y la tierra." },
      { ref: "Éxodo 3:14", text: "Y respondió Dios a Moisés: YO SOY EL QUE SOY. Y dijo: Así dirás a los hijos de Israel: YO SOY me envió a vosotros." },
      { ref: "Salmos 90:2", text: "Antes que naciesen los montes, y formases la tierra y el mundo, y desde el siglo y hasta el siglo, tú eres Dios." },
      { ref: "1 Juan 4:8", text: "El que no ama, no conoce a Dios; porque Dios es amor." },
      { ref: "Malaquías 3:6", text: "Porque yo Jehová, no me mudo; por esto, hijos de Jacob, no habéis sido consumidos." },
      { ref: "Salmos 139:7-8", text: "¿A dónde me iré de tu Espíritu? ¿Y a dónde huiré de tu presencia? Si subiere a los cielos, allí estás tú." },
      { ref: "Isaías 55:8-9", text: "Porque mis pensamientos no son vuestros pensamientos, ni vuestros caminos mis caminos, dijo Jehová." },
      { ref: "Job 1:21", text: "Jehová dió, y Jehová quitó: sea el nombre de Jehová bendito." },
      { ref: "Job 38:4", text: "¿Dónde estabas tú cuando yo fundaba la tierra? Házmelo saber, si tienes inteligencia." },
      { ref: "Job 42:2", text: "Yo conozco que todo lo puedes, y que no hay pensamiento que se esconda de ti." },
      { ref: "Job 12:10", text: "En su mano está el alma de todo viviente, y el espíritu de toda carne humana." },
      { ref: "Job 23:10", text: "Mas él conoció mi camino: probaráme, y saldré como oro." },
      { ref: "Mateo 5:8", text: "Bienaventurados los de limpio corazón: porque ellos verán a Dios." },
      { ref: "Mateo 5:48", text: "Sed, pues, vosotros perfectos, como vuestro Padre que está en los cielos es perfecto." },
      { ref: "Isaías 6:3", text: "Y el uno al otro daba voces, diciendo: Santo, santo, santo, Jehová de los ejércitos: toda la tierra está llena de su gloria." },
      { ref: "Éxodo 15:11", text: "¿Quién como tú, Jehová, entre los dioses? ¿Quién como tú, magnífico en santidad, terrible en loores, hacedor de maravillas?" },
      { ref: "Levítico 11:44-45", text: "Porque yo Jehová soy vuestro Dios: vosotros por tanto os santificaréis, y seréis santos, porque yo soy santo." },
      { ref: "1 Pedro 1:15-16", text: "Sino como aquel que os ha llamado es santo, sed también vosotros santos en toda conversación: porque escrito está: Sed santos, porque yo soy santo." },
      { ref: "Apocalipsis 4:8", text: "Y los cuatro animales tenían cada uno por sí seis alas alrededor, y de dentro estaban llenos de ojos; y no tenían reposo día ni noche, diciendo: Santo, santo, santo el Señor Dios Todopoderoso, que era, y que es, y que ha de venir." },
      { ref: "Jeremías 32:17", text: "¡Ah Señor Jehová! He aquí que tú hiciste el cielo y la tierra con tu gran poder, y con tu brazo extendido, ni hay nada que sea difícil para ti." },
      { ref: "Salmos 62:11", text: "Una vez habló Dios; dos veces he oído esto: Que de Dios es el poder." },
      { ref: "Mateo 19:26", text: "Y mirándolos Jesús, les dice: Para con los hombres, imposible es; mas para con Dios, todo es posible." },
      { ref: "Isaías 40:28", text: "¿No has sabido, no has oído, que el Dios del siglo es Jehová, el cual crió los términos de la tierra? No se trabaja, ni se fatiga con cansancio, y su entendimiento no hay quien lo alcance." },
      { ref: "Efesios 3:20", text: "Y a Aquel que es poderoso para hacer todas las cosas mucho más abundantemente de lo que pedimos o entendemos, según la potencia que obra en nosotros." },
      { ref: "Salmos 19:1", text: "Los cielos cuentan la gloria de Dios, y la expansión denuncia la obra de sus manos." },
      { ref: "Habacuc 2:14", text: "Porque la tierra será llena del conocimiento de la gloria de Jehová, como las aguas cubren la mar." },
      { ref: "Salmos 24:7-10", text: "Alzad, oh puertas, vuestras cabezas, y alzaos vosotras, puertas eternas, y entrará el Rey de gloria. ¿Quién es este Rey de gloria? Jehová el fuerte y valiente, Jehová el poderoso en batalla... Jehová de los ejércitos, él es el Rey de la gloria." },
      { ref: "Romanos 11:36", text: "Porque de él, y por él, y en él, son todas las cosas. A él sea gloria por siglos. Amén." },
      { ref: "1 Timoteo 1:17", text: "Por tanto, al Rey de siglos, inmortal, invisible, al solo sabio Dios, sea honor y gloria por siglos de siglos. Amén." },
      { ref: "Éxodo 20:4-5", text: "No te harás imagen, ni ninguna semejanza de cosa que esté arriba en el cielo, ni abajo en la tierra, ni en las aguas debajo de la tierra: no te inclinarás a ellas, ni las honrarás; porque yo soy Jehová tu Dios, fuerte, celoso, que visito la maldad de los padres sobre los hijos, sobre los terceros y sobre los cuartos, a los que me aborrecen." },
      { ref: "Éxodo 32:7-8", text: "Entonces Jehová dijo a Moisés: Anda, desciende, porque tu pueblo que sacaste de tierra de Egipto se ha corrompido: presto se han apartado del camino que yo les mandé, y se han hecho un becerro de fundición, y lo han adorado, y han sacrificado a él, y han dicho: Israel, estos son tus dioses, que te sacaron de la tierra de Egipto." },
      { ref: "Salmos 106:19-20", text: "Hicieron becerro en Horeb, y encorváronse a un vaciadizo. Así trocaron su gloria por la imagen de un buey que come hierba." },
      { ref: "Salmos 115:4-8", text: "La imágenes de ellos son plata y oro, obra de manos de hombres. Tienen boca, mas no hablarán; tienen ojos, mas no verán; orejas tienen, mas no oirán; tienen narices, mas no olerán; manos tienen, mas no palparán; tienen pies, mas no andarán; no hablarán con su garganta. Semejantes a ellos son los que los hacen; cualquiera que en ellos confía." },
      { ref: "Habacuc 2:18-19", text: "¿De qué sirve la escultura que esculpió el que la hizo? ¿La estatua de fundición, que enseña mentira, para que haciendo imágenes mudas confíe el hacedor en su obra? ¡Ay del que dice al leño: Despierta; y a la piedra muda: Levántate! ¿Podrá él enseñar? He aquí él está cubierto de oro y plata, y no hay espíritu dentro de él." },
      { ref: "Romanos 1:21-23,25", text: "Porque habiendo conocido a Dios, no le glorificaron como a Dios, ni dieron gracias; antes se desvanecieron en sus discursos, y su necio corazón fue entenebrecido. Diciendo ser sabios, se hicieron fatuos, y trocaron la gloria del Dios incorruptible en semejanza de imagen de hombre corruptible, y de aves, y de animales de cuatro pies, y de serpientes. Que mudaron la verdad de Dios en mentira, honrando y sirviendo a las criaturas antes que al Criador, el cual es bendito por los siglos. Amén." },
      { ref: "Gálatas 5:19-20", text: "Y manifiestas son las obras de la carne, que son: adulterio, fornicación, inmundicia, disolución, idolatría, hechicerías, enemistades, pleitos, celos, iras, contiendas, disensiones, herejías." },

      { ref: "Juan 1:1", text: "En el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios." },
      { ref: "Juan 1:14", text: "Y aquel Verbo fue hecho carne, y habitó entre nosotros (y vimos su gloria, gloria como del unigénito del Padre), lleno de gracia y de verdad." },
      { ref: "Juan 3:16", text: "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna." },
      { ref: "Juan 14:6", text: "Yo soy el camino, y la verdad, y la vida: nadie viene al Padre, sino por mí." },
      { ref: "Filipenses 2:9-11", text: "Por lo cual Dios también le ensalzó a lo sumo, y dióle un nombre que es sobre todo nombre; para que en el nombre de Jesús se doble toda rodilla." },
      { ref: "1 Corintios 15:3-4", text: "Que Cristo fue muerto por nuestros pecados conforme a las Escrituras; y que fue sepultado, y que resucitó al tercer día, conforme a las Escrituras." },
      { ref: "Hebreos 13:8", text: "Jesucristo es el mismo ayer, y hoy, y por los siglos." },

  {

      { ref: "Hechos 1:8", text: "Mas recibiréis la virtud del Espíritu Santo que vendrá sobre vosotros; y me seréis testigos." },

      { ref: "Juan 16:13", text: "Pero cuando viniere aquel Espíritu de verdad, él os guiará a toda verdad." },

  {
    id: "salvacion",
    name: "Salvación y el Reino de los Cielos",
    law: { ref: "Juan 3:3", text: "De cierto, de cierto te digo, que el que no naciere otra vez, no puede ver el reino de Dios." },
    verses: [
      { ref: "Mateo 5:3", text: "Bienaventurados los pobres en espíritu: porque de ellos es el reino de los cielos." },
      { ref: "Mateo 5:4", text: "Bienaventurados los que lloran: porque ellos recibirán consolación." },
      { ref: "Mateo 5:5", text: "Bienaventurados los mansos: porque ellos recibirán la tierra por heredad." },
      { ref: "Mateo 5:6", text: "Bienaventurados los que tienen hambre y sed de justicia: porque ellos serán hartos." },
      { ref: "Mateo 5:20", text: "Porque os digo, que si vuestra justicia no fuere mayor que la de los escribas y de los Fariseos, no entraréis en el reino de los cielos." },
      { ref: "Efesios 2:8-9", text: "Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios: No por obras, para que nadie se gloríe." },
      { ref: "Romanos 10:9", text: "Que si confesares con tu boca al Señor Jesús, y creyeres en tu corazón que Dios le levantó de los muertos, serás salvo." },
      { ref: "Hechos 4:12", text: "Y en ningún otro hay salud: porque no hay otro nombre debajo del cielo, dado a los hombres, en que podamos ser salvos." },
      { ref: "Mateo 18:3", text: "De cierto os digo, que si no os volviereis, y fuereis como niños, no entraréis en el reino de los cielos." },
      { ref: "Juan 3:5", text: "El que no naciere de agua y del Espíritu, no puede entrar en el reino de Dios." },
      { ref: "Romanos 6:23", text: "Porque la paga del pecado es muerte: mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro." },
      { ref: "Mateo 13:31-32", parable: true, text: "El reino de los cielos es semejante al grano de mostaza, que tomándolo alguno lo sembró en su campo: El cual a la verdad es la más pequeña de todas las simientes; mas cuando ha crecido, es la mayor de las hortalizas, y se hace árbol, que vienen las aves del cielo, y hacen nidos en sus ramas." },
      { ref: "Mateo 13:33", parable: true, text: "El reino de los cielos es semejante a la levadura que tomó una mujer, y escondió en tres medidas de harina, hasta que todo quedó leudo." },
      { ref: "Mateo 13:44", parable: true, text: "Además, el reino de los cielos es semejante al tesoro escondido en el campo; el cual hallado, el hombre lo encubre, y de gozo de ello va, y vende todo lo que tiene, y compra aquel campo." },
      { ref: "Mateo 13:45-46", parable: true, text: "También el reino de los cielos es semejante al hombre tratante, que busca buenas perlas; que hallando una preciosa perla, fue y vendió todo lo que tenía, y la compró." },
      { ref: "Mateo 13:47-50", parable: true, text: "Asimismo el reino de los cielos es semejante a la red, que echada en la mar, coge de todas suertes de peces: La cual estando llena, la sacaron a la orilla; y sentados, cogieron lo bueno en vasos, y lo malo echaron fuera. Así será al fin del siglo: saldrán los ángeles, y apartarán a los malos de entre los justos, y los echarán en el horno del fuego: allí será el lloro y el crujir de dientes." },
      { ref: "Mateo 25:1-13", parable: true, text: "Entonces el reino de los cielos será semejante a diez vírgenes, que tomando sus lámparas, salieron a recibir al esposo. Y las cinco de ellas eran prudentes, y las cinco fatuas. Y tardándose el esposo, cabecearon todas, y se durmieron. Y a la media noche fue oído un clamor: He aquí, el esposo viene; salid a recibirle. Entonces todas aquellas vírgenes se levantaron, y aderezaron sus lámparas. Y las fatuas dijeron a las prudentes: Dadnos de vuestro aceite; porque nuestras lámparas se apagan. Mas las prudentes respondieron, diciendo: Porque no nos falte a nosotras y a vosotras, id antes a los que venden, y comprad para vosotras. Y mientras que ellas fueron a comprar, vino el esposo; y las que estaban apercibidas, entraron con él a las bodas; y se cerró la puerta. Y después vinieron también las otras vírgenes, diciendo: Señor, Señor, ábrenos. Mas respondiendo él, dijo: De cierto os digo, que no os conozco. Velad, pues, porque no sabéis el día ni la hora en que el Hijo del hombre ha de venir." },
      { ref: "Mateo 25:14-30", parable: true, text: "Porque el reino de los cielos es como un hombre que partiéndose lejos, llamó a sus siervos, y les entregó sus bienes. Y al uno dio cinco talentos, y al otro dos, y al otro uno: a cada uno conforme a su facultad; y luego se partió lejos. Y el que había recibido cinco talentos se fue, y granjeó con ellos, e hizo otros cinco talentos. Y el que había recibido uno fue, y cavó en la tierra, y escondió el dinero de su señor. Y después de mucho tiempo, vino el señor de aquellos siervos, y hizo cuentas con ellos. Y su señor le dijo: Bien, buen siervo y fiel; sobre poco has sido fiel, sobre mucho te pondré: entra en el gozo de tu señor. Mas respondiendo el que había recibido un talento, dijo: Señor, te conocía que eres hombre duro, que siegas donde no sembraste, y recoges donde no esparciste: Y tuve miedo, y fui, y escondí tu talento en la tierra: he aquí tienes lo que es tuyo. Y respondiendo su señor, le dijo: Malo y negligente siervo, quitadle pues el talento, y dadlo al que tiene diez talentos. Porque a cualquiera que tuviere, le será dado, y tendrá más; y al que no tuviere, aun lo que tiene le será quitado. Y al siervo inútil echadle en las tinieblas de afuera: allí será el lloro y el crujir de dientes." },
      { ref: "Mateo 20:1-16", parable: true, text: "El reino de los cielos es semejante a un hombre, padre de familia, que salió por la mañana a ajustar obreros para su viña. Y saliendo cerca de la hora undécima, halló otros que estaban ociosos, y les envió también a la viña. Y venida la tarde, dijo el señor de la viña: Llama a los obreros, y págales el jornal, comenzando desde los postreros hasta los primeros. Y tomándolo, murmuraban contra el padre de la familia, diciendo: Estos postreros sólo han trabajado una hora, y los has hecho iguales a nosotros. Y él respondiendo, dijo: Amigo, no te hago agravio; ¿no te concertaste conmigo por un denario? Toma lo que es tuyo, y vete; mas quiero dar a este postrero, como a ti. ¿No me es lícito a mí hacer lo que quiero con lo mío? ¿es malo tu ojo, porque yo soy bueno? Así los primeros serán postreros, y los postreros primeros." },
      { ref: "Mateo 7:21-23", text: "No todo el que me dice: Señor, Señor, entrará en el reino de los cielos: mas el que hiciere la voluntad de mi Padre que está en los cielos. Muchos me dirán en aquel día: Señor, Señor, ¿no profetizamos en tu nombre, y en tu nombre lanzamos demonios, y en tu nombre hicimos muchos milagros? Y entonces les protestaré: Nunca os conocí: apartaos de mí, obradores de maldad." },
    ],

  {
    id: "oracion",
    name: "Oración",
    law: { ref: "Mateo 6:9", text: "Vosotros pues, oraréis así: Padre nuestro que estás en los cielos, santificado sea tu nombre." },
    verses: [
      { ref: "Mateo 6:9-13", text: "Padre nuestro que estás en los cielos, santificado sea tu nombre. Venga tu reino. Sea hecha tu voluntad, como en el cielo, así también en la tierra. Danos hoy nuestro pan cotidiano. Y perdónanos nuestras deudas, como también nosotros perdonamos a nuestros deudores. Y no nos metas en tentación, mas líbranos del mal: porque tuyo es el reino, y el poder, y la gloria, por todos los siglos. Amén." },
      { ref: "Salmos 23:1-4", text: "Jehová es mi pastor; nada me faltará. En lugares de delicados pastos me hará yacer: junto a aguas de reposo me pastoreará. Confortará mi alma: guiarme ha por sendas de justicia por amor de su nombre. Aunque ande en valle de sombra de muerte, no temeré mal alguno; porque tú estarás conmigo." },
      { ref: "Filipenses 4:6-7", text: "Por nada estéis afanosos; sino sean notorias vuestras peticiones delante de Dios en toda oración y ruego, con hacimiento de gracias. Y la paz de Dios, que sobrepuja todo entendimiento, guardará vuestros corazones y vuestros entendimientos en Cristo Jesús." },
      { ref: "Jeremías 29:12-13", text: "Y me invocaréis, é iréis, y oraréis á mí, y yo os oiré. Y me buscaréis y hallaréis, porque me buscaréis de todo vuestro corazón." },
      { ref: "1 Tesalonicenses 5:17", text: "Orad sin cesar." },
      { ref: "Mateo 7:7-8", text: "Pedid, y se os dará; buscad, y hallaréis; llamad, y se os abrirá. Porque cualquiera que pide, recibe; y el que busca, halla; y al que llama, se abrirá." },
      { ref: "Salmos 51:10", text: "Crea en mí, oh Dios, un corazón limpio; y renueva un espíritu recto dentro de mí." },
      { ref: "Salmos 121:1-2", text: "Alzaré mis ojos á los montes, de donde vendrá mi socorro. Mi socorro viene de Jehová, que hizo los cielos y la tierra." },
      { ref: "Marcos 11:24-25", text: "Por tanto os digo que todo lo que orando pidiereis, creed que lo recibiréis, y os vendrá. Y cuando estuviereis orando, perdonad, si tenéis algo contra alguno, para que vuestro Padre que está en los cielos os perdone también á vosotros vuestras ofensas." },
      { ref: "Santiago 5:16", text: "La oración del justo, obrando eficazmente, puede mucho." },
      { ref: "Salmos 34:17-18", text: "Clamaron los justos, y Jehová oyó, y librólos de todas sus angustias. Cercano está Jehová á los quebrantados de corazón; y salva á los contritos de espíritu." },
      { ref: "Números 6:24-26", text: "Jehová te bendiga, y te guarde: Haga resplandecer Jehová su rostro sobre ti, y haya de ti misericordia: Jehová alce á ti su rostro, y ponga en ti paz." },
    ],
  },
  {
    id: "fe",
    name: "Fe",
    law: { ref: "Habacuc 2:4", text: "Mas el justo en su fe vivirá." },
    verses: [
      { ref: "Hebreos 11:1", text: "Es, pues, la fe la sustancia de las cosas que se esperan, la demostración de las cosas que no se ven." },
      { ref: "Marcos 11:24", text: "Por tanto os digo que todo lo que orando pidiereis, creed que lo recibiréis, y os vendrá." },
      { ref: "Romanos 10:17", text: "Así que la fe es por el oír, y el oír por la palabra de Dios." },
      { ref: "2 Corintios 5:7", text: "Porque por fe andamos, no por vista." },
      { ref: "Santiago 1:6", text: "Pero pida en fe, no dudando nada; porque el que duda es semejante a la onda del mar, que es movida del viento y echada de una parte a otra." },

  {
    id: "hombres",
    name: "Identidad del hombre",
    law: { ref: "Josué 1:9", text: "Esfuérzate y sé valiente; no temas ni desmayes, porque Jehová tu Dios será contigo en donde quiera que fueres." },
    verses: [
      { ref: "1 Corintios 7:32-34", text: "Mas yo os quisiera sin congoja. El soltero tiene cuidado de las cosas que son del Señor, cómo ha de agradar al Señor: Empero el que se casó tiene cuidado de las cosas que son del mundo, cómo ha de agradar a su mujer. Hay asimismo diferencia entre la casada y la doncella: la doncella tiene cuidado de las cosas del Señor, para ser santa así de cuerpo como de espíritu; mas la casada tiene cuidado de las cosas del mundo, cómo ha de agradar a su marido." },
      { ref: "1 Corintios 6:18", text: "Huid la fornicación. Cualquier otro pecado que el hombre hiciere, fuera del cuerpo es; mas el que fornica, contra su propio cuerpo peca." },
      { ref: "1 Corintios 16:13", text: "Velad, estad firmes en la fe; portaos varonilmente, y esforzaos." },
      { ref: "Efesios 5:25", text: "Maridos, amad a vuestras mujeres, así como Cristo amó a la iglesia, y se entregó a sí mismo por ella." },
      { ref: "Proverbios 27:17", text: "Hierro con hierro se aguza; y así el hombre aguza el rostro de su amigo." },
      { ref: "1 Timoteo 3:4-5", text: "Que gobierne bien su casa, que tenga sus hijos en sujeción con toda honestidad." },
      { ref: "Miqueas 6:8", text: "Oh hombre, él te ha declarado qué sea lo bueno, y qué pide Jehová de ti: solamente hacer juicio, y amar misericordia, y humillarte para andar con tu Dios." },
      { ref: "1 Timoteo 5:8", text: "Porque si alguno no tiene cuidado de los suyos, y mayormente de los de su casa, la fe negó, y es peor que un infiel." },
      { ref: "Génesis 3:19", text: "En el sudor de tu rostro comerás el pan, hasta que vuelvas a la tierra; porque de ella fuiste tomado: pues polvo eres, y al polvo serás tornado." },
      { ref: "Colosenses 3:19", text: "Maridos, amad a vuestras mujeres, y no seáis desapacibles con ellas." },
      { ref: "1 Pedro 3:7", text: "Vosotros, maridos, semejantemente, habitad con ellas según ciencia, dando honor a la mujer como a vaso más frágil, y como a herederas juntamente de la gracia de la vida; para que vuestras oraciones no sean estorbadas." },
      { ref: "Proverbios 5:3-5", text: "Porque los labios de la extraña destilan miel, y su paladar es más blando que el aceite: mas su fin es amargo como el ajenjo, agudo como cuchillo de dos filos. Sus pies descienden a la muerte; sus pasos sustentan el sepulcro." },
      { ref: "Proverbios 6:24-26", text: "Para que te guarden de la mala mujer, de la blandura de la lengua de la extraña. No codicies su hermosura en tu corazón, ni te prenda con sus ojos: porque a causa de una mujer ramera es reducido el hombre a un bocado de pan; y la mujer caza la preciosa alma del varón." },
      { ref: "Proverbios 7:25-27", text: "No se aparte a sus caminos tu corazón; no yerres en sus veredas. Porque a muchos ha hecho caer heridos; y aun los más fuertes han sido muertos por ella. Caminos del sepulcro son su casa, que descienden a las cámaras de la muerte." },
      { ref: "Proverbios 2:16-19", text: "Para librarte de la mujer extraña, de la ajena que ablanda sus palabras. La cual desamparó al guía de su mocedad, y olvidó el pacto de su Dios. Por lo cual su casa está inclinada a la muerte, y sus veredas hacia los muertos: todos los que a ella entraren, no volverán, ni tomarán las veredas de la vida." },
      { ref: "Proverbios 22:14", text: "Sima profunda es la boca de las extrañas; aquel contra el cual estuviere Jehová airado, caerá en ella." },
      { ref: "Proverbios 31:3", text: "No des a las mujeres tu fuerza, ni tus caminos a lo que destruye a los reyes." },
      { ref: "1 Reyes 21:25", text: "A la verdad ninguno fue como Achâb, que se vendiese a hacer lo malo a los ojos de Jehová; porque Jezabel su mujer le incitaba." },
      { ref: "2 Reyes 9:22", text: "Y fue que como Joram vio a Jehú, dijo: ¿Hay paz, Jehú? Y él respondió: ¿Qué paz, con las fornicaciones de Jezabel tu madre, y sus muchas hechicerías?" },
      { ref: "Apocalipsis 2:20", text: "Mas tengo unas pocas cosas contra ti: porque toleras que Jezabel, mujer que se dice profetisa, enseñe, y seduzca a mis siervos a fornicar, y a comer cosas sacrificadas a los ídolos." },
      { ref: "Jueces 16:18-19", text: "Y viendo Dalila que él le había descubierto todo su corazón, envió a llamar a los príncipes de los Filisteos, diciendo: Venid esta vez, porque él me ha descubierto todo su corazón. Y los príncipes de los Filisteos vinieron a ella, trayendo en su mano el dinero. Y ella le hizo dormir sobre sus rodillas, y llamó a un hombre, quien le rapó las siete guedejas de su cabeza; y ella comenzó a afligirlo, pues su fuerza se apartó de él." },
      { ref: "Génesis 39:12", text: "Y ella le tomó por su vestido, diciendo: Duerme conmigo. Mas él dejóle su vestido en las manos, y huyó, y salióse fuera." },
      { ref: "Mateo 14:8", text: "Y ella, instruida primero de su madre, dijo: Dame aquí en un plato la cabeza de Juan el Bautista." },
      { ref: "2 Reyes 11:1", text: "Y Athalía madre de Ochôzías, viendo que su hijo era muerto, levantóse, y destruyó toda la simiente real." },
      { ref: "2 Corintios 6:14", text: "No os juntéis en yugo con los infieles; porque ¿qué compañía tiene la justicia con la injusticia? ¿Y qué comunión la luz con las tinieblas?" },
      { ref: "Mateo 5:28", text: "Mas yo os digo, que cualquiera que mira a una mujer para codiciarla, ya adulteró con ella en su corazón." },
      { ref: "Job 31:1", text: "Hice pacto con mis ojos: ¿cómo pues había yo de pensar en virgen?" },
      { ref: "1 Tesalonicenses 4:3-5", text: "Porque la voluntad de Dios es vuestra santificación: que os apartéis de fornicación; que cada uno de vosotros sepa tener su vaso en santificación y honor; no con afecto de concupiscencia, como los Gentiles que no conocieron a Dios." },
      { ref: "Gálatas 5:16", text: "Digo pues: Andad en el Espíritu, y no satisfagáis la concupiscencia de la carne." },
      { ref: "Santiago 1:14-15", text: "Cada uno es tentado, cuando de su propia concupiscencia es atraído, y cebado. Y la concupiscencia, después que ha concebido, pare el pecado; y el pecado, siendo cumplido, engendra la muerte." },
      { ref: "Proverbios 6:27-29", text: "¿Tomará el hombre fuego en su seno, sin que sus vestidos se quemen? ¿Andará el hombre sobre las brasas, sin que sus pies se abrasen? Así el que entrare a la mujer de su prójimo; no será sin culpa cualquiera que la tocare." },
      { ref: "Proverbios 21:19", text: "Mejor es morar en tierra desierta, que con la mujer rencillosa e iracunda." },
      { ref: "Proverbios 21:9", text: "Mejor es vivir en un rincón de zaquizamí, que con la mujer rencillosa en espaciosa casa." },
      { ref: "1 Corintios 15:33", text: "No erréis: las malas conversaciones corrompen las buenas costumbres." },
      { ref: "2 Timoteo 2:22", text: "Ahora huye de los deseos juveniles; y sigue la justicia, la fe, la caridad, la paz, con los que invocan al Señor de puro corazón." },
      { ref: "Romanos 13:14", text: "Mas vestíos del Señor Jesucristo, y no hagáis caso de la carne en sus deseos." },
      { ref: "Colosenses 3:5", text: "Mortificad, pues, vuestros miembros que están sobre la tierra: fornicación, inmundicia, molicie, mala concupiscencia, y avaricia, que es idolatría." },
      { ref: "Efesios 5:3", text: "Pero fornicación y toda inmundicia, o avaricia, ni aun se nombre entre vosotros, como conviene a santos." },
      { ref: "Salmos 1:1-3", text: "Bienaventurado el varón que no anduvo en consejo de malos, ni estuvo en camino de pecadores, ni en silla de escarnecedores se ha sentado: antes en la ley de Jehová está su delicia, y en su ley medita de día y de noche. Y será como el árbol plantado junto a arroyos de aguas, que da su fruto en su tiempo, y su hoja no cae; y todo lo que hace, prosperará." },
      { ref: "Romanos 12:9", text: "El amor sea sin fingimiento: aborreciendo lo malo, llegándoos a lo bueno." },
    ],
  },
  {
    id: "mujeres",
    name: "Identidad de la mujer",
    law: { ref: "Proverbios 31:30", text: "Engañosa es la gracia, y vana la hermosura: la mujer que teme a Jehová, ésa será alabada." },
    verses: [
      { ref: "Proverbios 6:24-26", emphasize: "y la mujer caza la preciosa alma del varón", text: "Para que te guarden de la mala mujer, de la blandura de la lengua de la extraña. No codicies su hermosura en tu corazón, ni te prenda con sus ojos: porque a causa de una mujer ramera es reducido el hombre a un bocado de pan; y la mujer caza la preciosa alma del varón." },
      { ref: "1 Timoteo 2:11-15", text: "La mujer aprenda en silencio, con toda sujeción. Porque no permito a la mujer enseñar, ni tomar autoridad sobre el hombre, sino estar en silencio. Porque Adam fue formado el primero, después Eva. Y Adam no fue engañado, sino la mujer, siendo engañada, incurrió en transgresión. Empero se salvará engendrando hijos, si permaneciere en fe y caridad y santidad, con modestia." },
      { ref: "1 Corintios 14:34-35", text: "Vuestras mujeres callen en las congregaciones; porque no les es permitido hablar, sino que estén sujetas, como también la ley dice. Y si quieren aprender algo, pregunten en casa a sus maridos; porque es indecente que una mujer hable en la congregación." },
      { ref: "1 Corintios 7:32-34", text: "Mas yo os quisiera sin congoja. El soltero tiene cuidado de las cosas que son del Señor, cómo ha de agradar al Señor: Empero el que se casó tiene cuidado de las cosas que son del mundo, cómo ha de agradar a su mujer. Hay asimismo diferencia entre la casada y la doncella: la doncella tiene cuidado de las cosas del Señor, para ser santa así de cuerpo como de espíritu; mas la casada tiene cuidado de las cosas del mundo, cómo ha de agradar a su marido." },
      { ref: "1 Corintios 6:18", text: "Huid la fornicación. Cualquier otro pecado que el hombre hiciere, fuera del cuerpo es; mas el que fornica, contra su propio cuerpo peca." },
      { ref: "Proverbios 31:25", text: "Fuerza y honor son su vestidura; y en el día postrero reirá." },
      { ref: "Proverbios 31:26", text: "Abre su boca con sabiduría: y la ley de clemencia está en su lengua." },
      { ref: "1 Pedro 3:3-4", text: "Vuestro atavío no sea el externo de encrespamiento del cabello, y de ponerse joyas de oro, o en vestir gala de vestidos; sino el hombre del corazón que está encubierto, en incorruptible ornato de espíritu agradable y pacífico, lo cual es de grande estima delante de Dios." },
      { ref: "1 Timoteo 2:9-10", text: "Asimismo también las mujeres, ataviándose en hábito honesto, con vergüenza y modestia; no con cabellos encrespados, u oro, o perlas, o vestidos costosos; sino, como conviene a mujeres que profesan piedad, con obras buenas." },
      { ref: "Génesis 1:27", text: "Y creó Dios al hombre a su imagen, a imagen de Dios lo creó; varón y hembra los creó." },
      { ref: "Efesios 5:33", text: "Cada uno empero de vosotros de por sí, ame también a su mujer como a sí mismo; y la mujer reverencie a su marido." },
      { ref: "Proverbios 31:10", text: "Mujer virtuosa, ¿quién la hallará? Porque su estima sobrepuja largamente a la de piedras preciosas." },
      { ref: "Tito 2:4-5", text: "Que enseñen a las mujeres jóvenes a ser prudentes, a que amen a sus maridos, a que amen a sus hijos, a ser templadas, castas, que tengan cuidado de la casa, buenas, sujetas a sus maridos: porque la palabra de Dios no sea blasfemada." },
      { ref: "Proverbios 14:1", text: "La mujer sabia edifica su casa: mas la necia con sus manos la derriba." },
      { ref: "1 Pedro 3:1-2", text: "Asimismo vosotras, mujeres, sed sujetas a vuestros maridos; para que también los que no creen a la palabra, sean ganados sin palabra por la conversación de sus mujeres, considerando vuestra casta conversación, que es en temor." },
      { ref: "Proverbios 22:24-25", text: "No te entremetas con el iracundo, ni te acompañes con el hombre de enojos; porque no aprendas sus veredas, y tomes lazo para tu alma." },
      { ref: "1 Corintios 15:33", text: "No erréis: las malas conversaciones corrompen las buenas costumbres." },
      { ref: "2 Corintios 6:14", text: "No os juntéis en yugo con los infieles; porque ¿qué compañía tiene la justicia con la injusticia? ¿Y qué comunión la luz con las tinieblas?" },
      { ref: "1 Timoteo 5:13", text: "Y aun también aprenden a ser ociosas, andando de casa en casa; y no solo ociosas, mas también parleras y curiosas, hablando lo que no conviene." },
      { ref: "Tito 2:3", text: "Las viejas asimismo sean reverentes en el porte como conviene a santas, no calumniadoras, no dadas a mucho vino, maestras de honestidad." },
      { ref: "Proverbios 11:13", text: "El que anda en chismes, descubre el secreto: mas el de espíritu fiel encubre la cosa." },
      { ref: "Proverbios 16:28", text: "El hombre perverso levanta contienda; y el chismoso aparta los mejores amigos." },
      { ref: "Proverbios 20:19", text: "El que descubre el secreto, en chismes anda: no te entremetas, pues, con el que lisonjea con sus labios." },
      { ref: "Proverbios 26:20", text: "Sin leña se apaga el fuego: y donde no hay chismoso, cesa la contienda." },
      { ref: "Romanos 12:9", text: "El amor sea sin fingimiento: aborreciendo lo malo, llegándoos a lo bueno." },
    ],

  {
    id: "felicidad",
    name: "Felicidad y gratitud",
    law: { ref: "Salmos 144:15", text: "Bienaventurado el pueblo que tiene esto: bienaventurado el pueblo cuyo Dios es Jehová." },
    verses: [
      { ref: "Nehemías 8:10", text: "Id, comed las grosuras, y bebed lo dulce, y enviad partes a los que no tienen prevenido nada, porque día santo es a nuestro Señor: y no os entristezcáis, porque el gozo de Jehová es vuestra fortaleza." },
      { ref: "1 Tesalonicenses 5:16-18", text: "Estad siempre gozosos. Orad sin cesar. Dad gracias en todo; porque esta es la voluntad de Dios para con vosotros en Cristo Jesús." },
      { ref: "Salmos 100:4", text: "Entrad por sus puertas con acción de gracias, por sus atrios con alabanza: alabadle, bendecid su nombre." },
      { ref: "Salmos 107:1", text: "Alabad a Jehová, porque es bueno; porque para siempre es su misericordia." },
      { ref: "Colosenses 3:17", text: "Y todo lo que hacéis, sea de palabra, o de hecho, hacedlo todo en el nombre del Señor Jesús, dando gracias a Dios Padre por él." },
      { ref: "Efesios 5:20", text: "Dando gracias siempre de todo al Dios y Padre en el nombre de nuestro Señor Jesucristo." },
      { ref: "Salmos 16:11", text: "Me mostrarás la senda de la vida: hartura de alegrías hay con tu rostro; deleites en tu diestra para siempre." },
      { ref: "Juan 15:11", text: "Estas cosas os he hablado, para que mi gozo esté en vosotros, y vuestro gozo sea cumplido." },
      { ref: "Romanos 14:17", text: "Que el reino de Dios no es comida ni bebida, sino justicia y paz y gozo por el Espíritu Santo." },
      { ref: "Proverbios 17:22", text: "El corazón alegre produce buena disposición: mas el espíritu triste seca los huesos." },
      { ref: "Filipenses 4:4", text: "Gozaos en el Señor siempre: otra vez digo: Que os gocéis." },
      { ref: "Eclesiastés 3:12-13", text: "Yo he conocido que no hay mejor cosa para el hombre, que alegrarse, y hacer bien en su vida: y también, que el hombre coma y beba, y goce el bien de todo su trabajo: esto es don de Dios." },
      { ref: "Salmos 118:24", text: "Este es el día que hizo Jehová: nos gozaremos y alegraremos en él." },
    ],

  {
    id: "desapego",
    name: "Desapego de las cosas",
    law: { ref: "Job 1:21", text: "Desnudo salí del vientre de mi madre, y desnudo tornaré allá. Jehová dió, y Jehová quitó: sea el nombre de Jehová bendito." },
    verses: [
      { ref: "Eclesiastés 5:15", text: "Como salió del vientre de su madre, desnudo, así se vuelve, tornando como vino; y nada tomará de su trabajo para llevar en su mano." },
      { ref: "1 Timoteo 6:7-8", text: "Porque nada hemos traído a este mundo, y sin duda nada podremos sacar. Así que, teniendo sustento y con qué cubrirnos, seamos contentos con esto." },
      { ref: "Filipenses 4:11-13", text: "No lo digo en razón de indigencia, pues he aprendido a contentarme con lo que tengo. Sé estar humillado, y sé tener abundancia: en todo y por todo estoy enseñado, así para hartura como para hambre, así para abundancia como para necesidad. Todo lo puedo en Cristo que me fortalece." },
      { ref: "1 Juan 2:15-17", text: "No améis al mundo, ni las cosas que están en el mundo. Si alguno ama al mundo, el amor del Padre no está en él. Porque todo lo que hay en el mundo, la concupiscencia de la carne, y la concupiscencia de los ojos, y la soberbia de la vida, no es del Padre, mas es del mundo. Y el mundo se pasa, y su concupiscencia; mas el que hace la voluntad de Dios, permanece para siempre." },
      { ref: "Mateo 6:19-21", text: "No os hagáis tesoros en la tierra, donde la polilla y el orín corrompe, y donde ladrones minan y hurtan; mas haceos tesoros en el cielo, donde ni polilla ni orín corrompe, y donde ladrones no minan ni hurtan. Porque donde estuviere vuestro tesoro, allí estará vuestro corazón." },
      { ref: "Hebreos 13:5", text: "Sean las costumbres vuestras sin avaricia; contentos de lo presente; porque él dijo: No te desampararé, ni te dejaré." },
      { ref: "Lucas 12:15", text: "Y díjoles: Mirad, y guardaos de toda avaricia; porque la vida del hombre no consiste en la abundancia de los bienes que posee." },
      { ref: "Mateo 19:21", text: "Dícele Jesús: Si quieres ser perfecto, anda, vende lo que tienes, y dalo a los pobres, y tendrás tesoro en el cielo; y ven, sígueme." },
      { ref: "Marcos 8:36", text: "Porque ¿qué aprovechará al hombre, si granjeare todo el mundo, y perdiere su alma?" },
      { ref: "Colosenses 3:2", text: "Poned la mira en las cosas de arriba, no en las de la tierra." },
      { ref: "Salmos 62:10", text: "No confiéis en la violencia, ni en la rapiña; no os envanezcáis: si se aumentare la hacienda, no pongáis el corazón en ello." },
      { ref: "Proverbios 30:8-9", text: "No me des pobreza ni riquezas; manténme del pan que he menester; no sea que me harte, y te niegue, y diga, ¿Quién es Jehová? ó no sea que siendo pobre, hurte, y blasfeme el nombre de mi Dios." },
      { ref: "1 Timoteo 6:17", text: "A los ricos de este siglo manda que no sean altivos, ni pongan la esperanza en la incertidumbre de las riquezas, sino en el Dios vivo, que nos da todas las cosas en abundancia de que gocemos." },
      { ref: "Lucas 12:16-21", parable: true, text: "Y refirióles una parábola, diciendo: La heredad de un hombre rico había llevado mucho fruto; y él pensaba dentro de sí, diciendo: ¿Qué haré, porque no tengo donde juntar mis frutos? Y dijo: Esto haré: derribaré mis alfolíes, y los edificaré mayores, y allí juntaré todos mis frutos y mis bienes; y diré a mi alma: Alma, muchos bienes tienes guardados para muchos años; repósate, come, bebe, huélgate. Y díjole Dios: Necio, esta noche vuelven a pedir tu alma; y lo que has prevenido, ¿de quién será? Así es el que hace para sí tesoro, y no es rico en Dios." },
    ],
  },
  {
    id: "sabiduria",
    name: "Sabiduría",
    law: { ref: "Proverbios 9:10", text: "El temor de Jehová es el principio de la sabiduría; y la ciencia de los santos es inteligencia." },
    verses: [
      { ref: "Proverbios 3:5-6", text: "Fíate de Jehová de todo tu corazón, y no estribes en tu prudencia. Reconócelo en todos tus caminos, y él enderezará tus veredas." },
      { ref: "Santiago 1:5", text: "Y si alguno de vosotros tiene falta de sabiduría, demándela a Dios, el cual da a todos abundantemente, y no zahiere, y le será dada." },
      { ref: "Proverbios 1:7", text: "El principio de la sabiduría es el temor de Jehová; los insensatos desprecian la sabiduría y la enseñanza." },
      { ref: "Proverbios 4:7", text: "Sabiduría ante todo; adquiere sabiduría, y ante toda tu posesión adquiere inteligencia." },
      { ref: "Eclesiastés 7:12", text: "Porque escudo es la ciencia, y escudo es el dinero; mas la sabiduría excede en que da vida a sus poseedores." },
      { ref: "Proverbios 2:6", text: "Porque Jehová da la sabiduría, y de su boca viene el conocimiento y la inteligencia." },
      { ref: "Proverbios 9:9", text: "Da al sabio, y será más sabio: enseña al justo, y acrecentará su saber." },
      { ref: "Proverbios 13:20", text: "El que anda con los sabios, sabio será: mas el que se allega a los necios, será quebrantado." },
      { ref: "Proverbios 19:20", text: "Escucha el consejo, y recibe la corrección, para que seas sabio en tu vejez." },
      { ref: "Santiago 3:17", text: "Mas la sabiduría que es de lo alto, primeramente es pura, después pacífica, modesta, benigna, llena de misericordia y de buenos frutos, no juzgadora, no fingida." },
      { ref: "Colosenses 2:3", text: "En el cual están escondidos todos los tesoros de sabiduría y conocimiento." },
      { ref: "Isaías 5:21", text: "¡Ay de los sabios en sus propios ojos, y de los que son prudentes delante de sí mismos!" },
      { ref: "Proverbios 3:7", text: "No seas sabio en tu opinión: teme a Jehová, y apártate del mal." },
      { ref: "Proverbios 26:12", text: "¿Has visto hombre sabio en su opinión? Más esperanza hay del necio que de él." },
      { ref: "Romanos 12:16", text: "Unánimes entre vosotros: no altivos, mas acomodándoos a los humildes. No seáis sabios en vuestra opinión." },
      { ref: "Jeremías 9:23-24", text: "Así dijo Jehová: No se alabe el sabio en su sabiduría, ni en su valentía se alabe el valiente, ni el rico se alabe en sus riquezas: mas alábese en esto el que se hubiere de alabar: en entenderme y conocerme, que yo soy Jehová, que hago misericordia, juicio, y justicia en la tierra; porque estas cosas quiero, dice Jehová." },
      { ref: "1 Corintios 1:19-20", text: "Porque está escrito: Destruiré la sabiduría de los sabios, y desecharé la inteligencia de los entendidos. ¿Qué es del sabio? ¿Qué del escriba? ¿Qué del escudriñador de este siglo? ¿No ha enloquecido Dios la sabiduría del mundo?" },
      { ref: "1 Corintios 1:25", text: "Porque lo loco de Dios es más sabio que los hombres; y lo flaco de Dios es más fuerte que los hombres." },
      { ref: "1 Corintios 3:18-19", text: "Nadie se engañe a sí mismo: si alguno entre vosotros parece ser sabio en este siglo, hágase simple, para ser sabio. Porque la sabiduría de este mundo es necedad para con Dios; pues escrito está: El que prende a los sabios en la astucia de ellos." },
      { ref: "1 Corintios 8:1-2", text: "La ciencia hincha, mas la caridad edifica. Y si alguno se imagina que sabe algo, aun no sabe nada como debe saber." },
      { ref: "Colosenses 2:8", text: "Mirad que ninguno os engañe por filosofías y vanas sutilezas, según las tradiciones de los hombres, conforme a los elementos del mundo, y no según Cristo." },
      { ref: "1 Timoteo 6:20", text: "Guarda el depósito, evitando las profanas vocerías de vanas doctrinas, y los argumentos de la falsamente llamada ciencia." },
    ],
  },
  {
    id: "gobierno",
    name: "El gobierno",
    law: {
      ref: "Lucas 4:5-7",
      text: "Y le llevó el diablo a un alto monte, y le mostró en un momento de tiempo todos los reinos de la tierra. Y le dijo el diablo: A ti te daré toda esta potestad, y la gloria de ellos; porque a mí es entregada, y a quien quiero la doy. Pues si tú adorares delante de mí, serán todos tuyos.",
      emphasize: "A ti te daré toda esta potestad, y la gloria de ellos; porque a mí es entregada, y a quien quiero la doy.",
    },
    verses: [
      { ref: "1 Samuel 8:6-7", text: "Y descontentó a Samuel esta palabra que dijeron: Danos rey que nos juzgue. Y Samuel oró a Jehová. Y dijo Jehová a Samuel: Oye la voz del pueblo en todo lo que te dijeren; porque no te han desechado a ti, sino a mí me han desechado, para que no reine sobre ellos.", emphasize: "sino a mí me han desechado" },
      { ref: "1 Samuel 8:11-22", emphasize: ["y seréis sus siervos", "mas Jehová no os oirá en aquel día"], text: "Este será el derecho del rey que ha de reinar sobre vosotros: tomará vuestros hijos, y los pondrá en sus carros, y en su gente de a caballo, para que corran delante de su carro. Pondrá para sí capitanes de mil y capitanes de cincuenta; los pondrá asimismo a que aren sus campos, y sieguen sus mieses, y a que hagan sus armas de guerra. Tomará también vuestras hijas para que sean perfumadoras, cocineras, y amasadoras. Asimismo tomará vuestras tierras, vuestras viñas, y vuestros buenos olivares, y los dará a sus siervos. Diezmará vuestras simientes y vuestras viñas, para dar a sus eunucos y a sus criados. Tomará vuestros siervos, y vuestras siervas, y vuestros mejores mancebos, y vuestros asnos, y con ellos hará sus obras. Diezmará también vuestros rebaños, y seréis sus siervos. Y clamaréis aquel día a causa de vuestro rey que os habréis elegido: mas Jehová no os oirá en aquel día. Mas el pueblo no quiso oír la voz de Samuel; y dijeron: No, sino que habrá rey sobre nosotros: y nosotros seremos también como todas las naciones, y nuestro rey nos gobernará, y saldrá delante de nosotros, y hará nuestras guerras. Y Jehová dijo a Samuel: Oye su voz, y pon rey sobre ellos. Entonces dijo Samuel a los varones de Israel: Idos cada uno a vuestra ciudad." },
      { ref: "Oseas 13:11", text: "Díte rey en mi furor, y quitélo en mi ira." },
      { ref: "Éxodo 1:11-14", text: "Entonces pusieron sobre él comisarios de tributos que los molestasen con sus cargas; y edificaron a Faraón las ciudades de los bastimentos. Mas cuanto más los oprimían, tanto más se multiplicaban y crecían: así que estaban ellos fastidiados de los hijos de Israel. Y los Egipcios hicieron servir a los hijos de Israel con dureza: y amargaron su vida con dura servidumbre, en hacer barro y ladrillo, y en toda labor del campo, y en todo su servicio, al cual los obligaban con rigorismo." },
      { ref: "Isaías 10:1-2", text: "¡Ay de los que establecen leyes injustas, y los que prescribiendo, prescriben tiranía, para privar del juicio a los pobres, y para quitar el derecho a los afligidos de mi pueblo; para despojar a las viudas, y robar a los huérfanos!" },
      { ref: "Miqueas 3:1-3", text: "Y dije: Oíd ahora, príncipes de Jacob, y jefes de la casa de Israel: ¿No pertenece a vosotros saber el derecho? Vosotros que aborrecéis lo bueno y amáis lo malo, que les quitáis su piel de sobre ellos, y su carne de sobre sus huesos." },
      { ref: "Eclesiastés 4:1", text: "Y volvíme yo, y vi todas las violencias que se hacen debajo del sol: y he aquí las lágrimas de los oprimidos, y sin tener quien los consuele; y la fuerza estaba en la mano de sus opresores, y para ellos no había consolador." },
      { ref: "Eclesiastés 5:8", text: "Si violencias de pobres, y extorsión de derecho y de justicia vieres en la provincia, no te maravilles de esta licencia; porque alto está mirando sobre alto, y uno más alto está sobre ellos." },
      { ref: "Proverbios 29:2", text: "Cuando los justos dominan, el pueblo se alegra: mas cuando domina el impío, el pueblo gime." },
      { ref: "Hechos 5:29", text: "Y respondiendo Pedro y los apóstoles, dijeron: Es menester obedecer a Dios antes que a los hombres." },
      { ref: "Mateo 22:17-21", text: "Dime pues, ¿qué te parece? ¿Es lícito dar tributo a César, o no? Mas Jesús, entendida la malicia de ellos, les dice: ¿Por qué me tentáis, hipócritas? Mostradme la moneda del tributo. Y ellos le presentaron un denario. Entonces les dice: ¿De quién es esta figura, y lo que está encima escrito? Dícenle: De César. Y les dice: Pagad pues a César lo que es de César; y a Dios lo que es de Dios." },
      { ref: "Romanos 13:1-2", text: "Toda alma se someta a las potestades superiores: porque no hay potestad sino de Dios; y las que son, de Dios son ordenadas. Así que, el que se opone a la potestad, a la ordenación de Dios resiste: y los que resisten, ellos mismos ganan condenación para sí." },
      { ref: "1 Pedro 2:13-14", text: "Sed pues sujetos a toda ordenación humana por respeto a Dios: ya sea al rey, como a superior; ya a los gobernadores, como de él enviados para venganza de los malhechores, y para loor de los que hacen bien." },
      { ref: "1 Timoteo 2:1-2", text: "Ruego, pues, ante todo, que se hagan rogativas, oraciones, peticiones, hacimientos de gracias, por todos los hombres; por los reyes y por todos los que están en eminencia, para que vivamos quieta y reposadamente en toda piedad y honestidad." },
      { ref: "Lucas 4:5-8", text: "Y le llevó el diablo a un alto monte, y le mostró en un momento de tiempo todos los reinos de la tierra. Y le dijo el diablo: A ti te daré toda esta potestad, y la gloria de ellos; porque a mí es entregada, y a quien quiero la doy. Pues si tú adorares delante de mí, serán todos tuyos. Y respondiendo Jesús, le dijo: Vete de mí, Satanás, porque escrito está: A tu Señor Dios adorarás, y a él solo servirás." },
      { ref: "Juan 12:31", text: "Ahora es el juicio de este mundo: ahora el príncipe de este mundo será echado fuera." },
      { ref: "Juan 14:30", text: "Ya no hablaré mucho con vosotros: porque viene el príncipe de este mundo; mas no tiene nada en mí." },
      { ref: "Juan 16:11", text: "Y de juicio; por cuanto el príncipe de este mundo es juzgado." },
      { ref: "2 Corintios 4:4", text: "En los cuales el dios de este siglo cegó los entendimientos de los incrédulos, para que no les resplandezca la lumbre del evangelio de la gloria de Cristo, el cual es la imagen de Dios." },
      { ref: "Efesios 2:2", text: "En que en otro tiempo anduvisteis conforme a la condición de este mundo, conforme al príncipe de la potestad del aire, el espíritu que ahora obra en los hijos de desobediencia." },
      { ref: "Efesios 6:12", text: "Porque no tenemos lucha contra sangre y carne; sino contra principados, contra potestades, contra señores del mundo, gobernadores de las tinieblas de este siglo, contra malicia espiritual en los aires." },
      { ref: "1 Juan 5:19", text: "Sabemos que somos de Dios, y todo el mundo está puesto en maldad." },
    ],
  },
  {
    id: "autodefensa",
    name: "Autodefensa",
    law: { ref: "Eclesiastés 3:1,8", text: "Todas las cosas tienen su tiempo, y todo lo que se quiere debajo del cielo tiene su hora... tiempo de guerra, y tiempo de paz." },
    verses: [
      { ref: "Lucas 22:36-38", text: "Y les dijo: Pues ahora, el que tiene bolsa, tómela, y también la alforja; y el que no tiene, venda su capa y compre espada. Porque os digo, que es necesario que se cumpla todavía en mí aquello que está escrito: Y con los malos fue contado; porque lo que está escrito de mí, cumplimiento tiene. Entonces ellos dijeron: Señor, he aquí dos espadas. Y él les dijo: Basta." },
      { ref: "Éxodo 22:2-3", text: "Si el ladrón fuere hallado forzando una casa, y fuere herido y muriere, el que le hirió no será culpado de su muerte. Mas si el sol hubiere salido sobre él, el matador será reo de homicidio: el ladrón habrá de restituir cumplidamente; si no tuviere, será vendido por su hurto." },
      { ref: "Nehemías 4:14,17-18", text: "Y miré, y levantéme, y dije á los principales y á los magistrados y al resto del pueblo: No temáis delante de ellos; acordaos del Señor grande y terrible, y pelead por vuestros hermanos, vuestros hijos y vuestras hijas, vuestras mujeres y vuestras casas. Y una mano trabajaba en la obra, y en la otra tenía cada uno la espada." },

const PALETTE = {
  parchment: "#F1E7CE",
  parchmentLight: "#F8F1E1",

  inkSoft: "#5A4E3C",
  navy: "#20293A",

function renderEmphasized(text, phrases) {
  if (!phrases) return text;
  const list = Array.isArray(phrases) ? phrases : [phrases];
  // Build list of {start, end} matches, sorted, non-overlapping
  const matches = [];
  list.forEach((phrase) => {
    const idx = text.toLowerCase().indexOf(phrase.toLowerCase());
    if (idx !== -1) matches.push({ start: idx, end: idx + phrase.length });
  });
  matches.sort((a, b) => a.start - b.start);
  if (matches.length === 0) return text;

  const parts = [];
  let cursor = 0;
  matches.forEach((m, i) => {
    if (m.start > cursor) parts.push(text.slice(cursor, m.start));
    parts.push(
      <strong key={i} style={{ textTransform: "uppercase", fontWeight: 700 }}>
        {text.slice(m.start, m.end)}
      </strong>
    );
    cursor = m.end;
  });
  if (cursor < text.length) parts.push(text.slice(cursor));
  return <>{parts}</>;
}

function highlight(text, query) {
  if (!query) return text;
  const parts = text.split(new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi"));
  return parts.map((part, i) =>
    part.toLowerCase() === query.toLowerCase() ? (
      <mark key={i} style={{ background: PALETTE.goldLight, color: PALETTE.ink, padding: "0 2px", borderRadius: 2 }}>
        {part}
      </mark>
    ) : (
      part
    )
  );
}

  const t = UI[lang];
  const [activeChapter, setActiveChapter] = useState(CHAPTERS_ES[0].id);
  const chapterTopRef = useRef(null);
  const goToChapter = (id) => {
    setActiveChapter(id);
    setTimeout(() => {
      if (chapterTopRef.current) {
        chapterTopRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }, 0);
  };
  const [query, setQuery] = useState("");

  const searchResults = useMemo(() => {
    if (!query.trim()) return null;
    const q = query.trim().toLowerCase();
    const results = [];
    chapters.forEach((ch, idx) => {
      ch.verses.forEach((v) => {
        if (
          v.text.toLowerCase().includes(q) ||
          v.ref.toLowerCase().includes(q) ||
          ch.name.toLowerCase().includes(q)
        ) {
          results.push({ ...v, chapterName: ch.name, chapterNum: idx + 1, chapterId: ch.id });
        }
      });
    });
    return results;
  }, [query, chapters]);

  const currentIndex = chapters.findIndex((c) => c.id === activeChapter);
  const currentChapter = chapters[currentIndex];

  return (
    <div
      style={{
        fontFamily: "'Lora', Georgia, serif",
        background: PALETTE.parchment,
        color: PALETTE.ink,
        minHeight: "100vh",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        .ch-btn { transition: all 0.15s ease; }
        .ch-btn:hover { transform: translateY(-1px); }
        input::placeholder { color: #8A7C63; }
        ::selection { background: ${PALETTE.goldLight}; }
      `}</style>

      <div style={{ maxWidth: 780, margin: "0 auto", padding: "40px 24px 80px" }}>
        {/* Language toggle */}
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
          <div style={{ display: "flex", border: `1px solid ${PALETTE.gold}66`, borderRadius: 20, overflow: "hidden" }}>
            {["es", "en"].map((l) => (
              <button
                key={l}
                onClick={() => setLang(l)}
                style={{
                  fontFamily: "'Inter', sans-serif",
                  fontSize: 12,
                  fontWeight: 600,
                  padding: "6px 14px",
                  border: "none",
                  background: lang === l ? PALETTE.navy : "transparent",
                  color: lang === l ? PALETTE.goldLight : PALETTE.inkSoft,
                  cursor: "pointer",
                }}
              >
                {l.toUpperCase()}
              </button>
            ))}
          </div>
        </div>

        {/* Header */}
        <header style={{ textAlign: "center", marginBottom: 36 }}>
          <p style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, letterSpacing: 3, textTransform: "uppercase", color: PALETTE.gold, margin: "0 0 8px" }}>
            {t.eyebrow}
          </p>
          <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 40, fontWeight: 700, margin: 0, color: PALETTE.navy }}>
            {t.title}
          </h1>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, marginTop: 14 }}>
            <span style={{ height: 1, width: 40, background: PALETTE.gold }} />
            <span style={{ color: PALETTE.gold, fontSize: 14 }}>✦</span>
            <span style={{ height: 1, width: 40, background: PALETTE.gold }} />
          </div>
        </header>

        {/* Search */}
        <div style={{ marginBottom: 28 }}>
          <input
            type="text"
            value={query}
            onChange={(e) => {
              setQuery(e.target.value);
            }}
            placeholder={t.searchPlaceholder}
            style={{
              width: "100%",
              padding: "14px 18px",
              fontSize: 15,
              fontFamily: "'Inter', sans-serif",
              background: PALETTE.parchmentLight,
              border: `1px solid ${PALETTE.gold}55`,
              borderRadius: 4,
              color: PALETTE.ink,
              outline: "none",
            }}
          />
        </div>

        {/* Chapter index - hidden while searching */}
        {!query.trim() && (
          <nav style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 32 }}>
            {chapters.map((ch, idx) => {
              const active = ch.id === activeChapter;
              const isTrinity = idx < 3;
              return (
                <button
                  key={ch.id}
                  className="ch-btn"
                  onClick={() => goToChapter(ch.id)}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 12,
                    fontFamily: "'Inter', sans-serif",
                    fontSize: 14,
                    textAlign: "left",
                    padding: "10px 16px",
                    borderRadius: 4,
                    border: "none",
                    borderLeft: `3px solid ${active ? PALETTE.burgundy : "transparent"}`,
                    background: active ? PALETTE.parchmentLight : "transparent",
                    color: PALETTE.ink,
                    cursor: "pointer",
                  }}
                >
                  <span
                    style={{
                      fontFamily: "'Playfair Display', serif",
                      fontSize: 13,
                      fontWeight: 700,
                      color: isTrinity ? PALETTE.burgundy : PALETTE.gold,
                      minWidth: 78,
                    }}
                  >
                    {t.chapterWord} {idx + 1}
                  </span>
                  <span style={{ fontWeight: active ? 600 : 400, color: active ? PALETTE.navy : PALETTE.inkSoft }}>
                    {ch.name}
                  </span>
                </button>
              );
            })}
          </nav>
        )}

        {/* Content */}
        {query.trim() ? (
          <div>
            <p style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: PALETTE.inkSoft, marginBottom: 18 }}>
              {t.resultsFor(searchResults.length, query)}
            </p>
            {searchResults.length === 0 ? (
              <p style={{ fontStyle: "italic", color: PALETTE.inkSoft, textAlign: "center", padding: "40px 0" }}>
                {t.noResults}
              </p>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                {searchResults.map((v, i) => (
                  <div
                    key={i}
                    style={{
                      background: PALETTE.parchmentLight,
                      borderLeft: `4px solid ${PALETTE.gold}`,
                      borderRadius: "0 6px 6px 0",
                      padding: "16px 20px",
                    }}
                  >
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                      <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, fontWeight: 600, letterSpacing: 0.5, color: PALETTE.burgundy, textTransform: "uppercase" }}>
                        {v.ref}
                      </span>
                      <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: PALETTE.gold, background: PALETTE.gold + "1A", padding: "2px 8px", borderRadius: 10 }}>
                        {lang === "en" ? "Ch." : "Cap."} {v.chapterNum} · {v.chapterName}
                      </span>
                    </div>
                    <p style={{ margin: 0, fontSize: 16, lineHeight: 1.65, fontStyle: "italic" }}>
                      {highlight(v.text, query)}
                    </p>
                  </div>
                ))}
              </div>
            )}
          </div>
        ) : (
          <div ref={chapterTopRef} style={{ position: "relative" }}>
            <div
              style={{
                position: "absolute",
                left: -14,
                top: 0,
                bottom: 0,
                width: 6,
                background: currentIndex < 3 ? PALETTE.burgundy : PALETTE.gold,
                borderRadius: 3,
              }}
            />
            <div
              style={{
                background: PALETTE.parchmentLight,
                borderRadius: 6,
                padding: "32px 36px",
                boxShadow: "0 1px 3px rgba(42,33,24,0.08)",
              }}
            >
              <div style={{ display: "flex", alignItems: "baseline", gap: 14, marginBottom: 24, paddingBottom: 14, borderBottom: `1px solid ${PALETTE.gold}44` }}>
                <span style={{ fontFamily: "'Playfair Display', serif", fontSize: 15, fontWeight: 700, color: PALETTE.gold }}>
                  {t.chapterWord} {currentIndex + 1}
                </span>
                <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 24, color: PALETTE.navy, margin: 0 }}>
                  {currentChapter.name}
                </h2>
              </div>

              {currentChapter.law && (
                <div
                  style={{
                    borderLeft: `3px solid ${PALETTE.burgundy}`,
                    padding: "4px 0 4px 20px",
                    margin: "0 0 28px",
                  }}
                >
                  <p
                    style={{
                      fontFamily: "'Inter', sans-serif",
                      fontSize: 10,
                      letterSpacing: 2,
                      textTransform: "uppercase",
                      color: PALETTE.burgundy,
                      margin: "0 0 6px",
                    }}
                  >
                    {t.lawLabel}
                  </p>
                  <p
                    style={{
                      fontFamily: "'Playfair Display', serif",
                      fontStyle: "italic",
                      fontSize: 21,
                      lineHeight: 1.5,
                      color: PALETTE.navy,
                      margin: "0 0 6px",
                    }}
                  >
                    {currentChapter.law.emphasize
                      ? renderEmphasized(currentChapter.law.text, currentChapter.law.emphasize)
                      : currentChapter.law.text}
                  </p>
                  <span
                    style={{
                      fontFamily: "'Inter', sans-serif",
                      fontSize: 12,
                      fontWeight: 600,
                      letterSpacing: 0.5,
                      color: PALETTE.gold,
                      textTransform: "uppercase",
                    }}
                  >
                    {currentChapter.law.ref}
                  </span>
                </div>
              )}

              <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
                {currentChapter.verses.map((v, i) => (
                  <div key={i}>
                    {v.parable && (
                      <span
                        style={{
                          display: "inline-block",
                          fontFamily: "'Inter', sans-serif",
                          fontSize: 10,
                          fontWeight: 600,
                          letterSpacing: 1,
                          textTransform: "uppercase",
                          color: PALETTE.burgundy,
                          background: PALETTE.burgundy + "15",
                          padding: "2px 8px",
                          borderRadius: 10,
                          marginBottom: 8,
                        }}
                      >
                        {t.parableLabel}
                      </span>
                    )}
                    <p style={{ margin: "0 0 4px", fontSize: 16.5, lineHeight: 1.7 }}>
                      {i === 0 ? (
                        <>
                          <span style={{ fontFamily: "'Playfair Display', serif", fontSize: 42, fontWeight: 700, color: PALETTE.gold, lineHeight: 0, verticalAlign: "-14px", marginRight: 2 }}>
                            {v.text.charAt(0)}
                          </span>
                          {renderEmphasized(v.text.slice(1), v.emphasize)}
                        </>
                      ) : (
                        renderEmphasized(v.text, v.emphasize)
                      )}
                    </p>
                    <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, fontWeight: 600, letterSpacing: 0.5, color: PALETTE.burgundy, textTransform: "uppercase" }}>
                      {v.ref}
                    </span>
                  </div>
                ))}
              </div>

              {/* Chapter navigation */}
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 32, paddingTop: 18, borderTop: `1px solid ${PALETTE.gold}33` }}>
                <button
                  disabled={currentIndex === 0}
                  onClick={() => goToChapter(chapters[currentIndex - 1].id)}
                  style={{
                    fontFamily: "'Inter', sans-serif",
                    fontSize: 13,
                    background: "none",
                    border: "none",
                    color: currentIndex === 0 ? "#B8AC93" : PALETTE.burgundy,
                    cursor: currentIndex === 0 ? "default" : "pointer",
                  }}
                >
                  {currentIndex > 0 ? `← ${t.chapterWord} ${currentIndex} · ${chapters[currentIndex - 1].name}` : ""}
                </button>
                <button
                  disabled={currentIndex === chapters.length - 1}
                  onClick={() => goToChapter(chapters[currentIndex + 1].id)}
                  style={{
                    fontFamily: "'Inter', sans-serif",
                    fontSize: 13,
                    background: "none",
                    border: "none",
                    color: currentIndex === chapters.length - 1 ? "#B8AC93" : PALETTE.burgundy,
                    cursor: currentIndex === chapters.length - 1 ? "default" : "pointer",
                  }}
                >
                  {currentIndex < chapters.length - 1 ? `${t.chapterWord} ${currentIndex + 2} · ${chapters[currentIndex + 1].name} →` : ""}
                </button>
              </div>
            </div>
          </div>
        )}

        <footer style={{ textAlign: "center", marginTop: 48 }}>
          <p style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: PALETTE.inkSoft }}>
            {t.footer}
          </p>
        </footer>
      </div>
    </div>
  );
}


      const rootEl = document.getElementById("root");
      if (window.React && window.ReactDOM && rootEl) {
        const root = ReactDOM.createRoot(rootEl);
        root.render(<BibliaPorTemas />);
      } else {
        document.getElementById("load-error").style.display = "block";
        document.getElementById("load-error").textContent =
          "No se pudieron cargar React/ReactDOM desde el CDN. Revisá tu conexión a internet.";
      }
    </script>
  </body>
</html>
